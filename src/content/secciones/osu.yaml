titulo: Cosas de osu!
orden: 2
bloques:
  - tipo: texto
    texto: |-
      Empecé jugando el de la Nintendo DS y me encantó. Por lo que ver hace ya casi 1 decada que tenia un port para PC fue muy bueno. 

      Cada año, trato de jugar por lo menos alguna vez a los 4 modos pero mis preferidos son osu!mania y osu!standard. Como tal no tengo una skill definida, me gusta jugar cualquier cosa. Tanto jumps, gimmick, reading, tech, etc.
  - tipo: destacado
    imagen: skin-whatsapp.png
    enlace: https://osu.ppy.sh/community/forums/topics/1521212?n=1
    descripcion: Skin de WhatsApp para osu!
    texto: "**No es un chiste**, uso esta skin para jugar. La única modificación que le he hecho es cambiar el cursor al de *Vaxei sin trail*."
